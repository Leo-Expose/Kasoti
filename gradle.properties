org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official

# Every Android dependency in this build is `androidx.*` (AGP 8 dropped the old support library),
# and AGP hard-fails `desugar*FileDependencies` when it sees an AndroidX classpath without this
# flag: "Configuration :app-android:debugRuntimeClasspath contains AndroidX dependencies, but the
# `android.useAndroidX` property is not enabled". It has never been set because :app-android had
# never been assembled. Not a gate and not a behaviour switch for :core / :platform / :app-desktop.
android.useAndroidX=true

# Android SDK location for local builds (CI sets ANDROID_HOME). Absent => Android modules skip.
sdk.dir=

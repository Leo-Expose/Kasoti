name: CI

# AGENTS.md §1: "CI runs on every push: build + core tests + eval smoke + lint +
# :core network-import ban + PII-scrubber test + APK/bundle size check."
# This workflow is that list, in the order that fails fastest and cheapest, plus the
# SDK-free Android proof that only `app-android/tools/verify-offline.sh` can give.
#
# Two things this file is careful about, because getting them wrong is how a CI becomes
# theatre:
#
#   1. No step claims to check something it does not check. A skipped step says SKIPPED,
#      an advisory step says ADVISORY and prints its finding count, and a step that cannot
#      run says why. `:app-android` is not in the build without an SDK, and no amount of
#      green ticks makes it so.
#   2. No step carries a number that will drift. Counts are read out of the tool that
#      produced them at run time. A hard-coded "171 findings" in a workflow file is a lie
#      waiting for the next commit, and nobody re-reads workflow files to check.

on:
  push:
    branches: ['**']          # every push, including feature branches (mX/*)
    tags: ['v*']
  pull_request:
  # Weekly offline proof (BUILD.md §1: "CI verifies with --offline weekly").
  # 03:17 UTC Mondays — off the hour on purpose, so it does not queue behind
  # every other team's Monday build.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      offline_proof:
        description: 'Also run the weekly --offline airplane build proof'
        type: boolean
        default: false

# Superseded runs on the same branch are wasted CI minutes; cancel them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false
  # BUILD.md §1 — JDK 17 is the toolchain every module compiles against.
  JAVA_VERSION: '17'

jobs:
  verify:
    name: build + core tests + eval smoke + gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (with build cache + dependency cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # ---------------------------------------------------------------------
      # WHAT IS ACTUALLY SDK-GATED, precisely.
      #
      # `settings.gradle.kts` ALWAYS includes `:core :platform :eval :app-desktop :ui`.
      # Only `:app-android` is behind the SDK gate (`include(":app-android")` inside
      # `if (androidEnabled)`), because it is the one module that applies AGP and needs a
      # real SDK to configure. `:ui` is plain `kotlin-jvm` with no Compose and no Android
      # dependency at all, so gating it behind an SDK would mean it is never compiled on
      # exactly the machines that can most cheaply check it.
      #
      # The previous version of this comment claimed `:ui` was SDK-gated and printed
      # "settings.gradle.kts will not include :ui" when no SDK was found. That was false,
      # and it mattered: it taught a reader that `:ui:test` never runs, which is why the
      # `:ui` test step below used to be conditional on an SDK and therefore had never run
      # in this workflow at all. `:ui:test` is now unconditional, for the same reason
      # `:core:jvmTest` is.
      # ---------------------------------------------------------------------
      # WHY THIS STEP IS NOT A GATE, AND WHY IT STILL CHECKS SOMETHING.
      #
      # Detection cannot fail the build — a runner legitimately may have no SDK, and
      # making that red would be a permanently red job for a fact about the machine.
      # What it MUST NOT do is pass while leaving the reader unable to tell whether the
      # shipping artefact was gated. Two things went wrong before this was checked, and
      # both were invisible from outside:
      #
      #   1. It accepted any *existing directory*. An SDK directory without
      #      platforms/android-35 (compileSdk 35, app-android/build.gradle.kts:168) is
      #      not an SDK this project can build against, and it would have been reported
      #      here as found — deferring the failure to an unrelated-looking Gradle error
      #      minutes later. So the platform the build actually needs is now required.
      #   2. Nothing downstream noticed when it said "not found". The Gate summary used
      #      to write a hard-coded row that said the size gate was "run" whenever an SDK
      #      existed and a fixed sentence about it when one did not; the bundle-manifest
      #      row did not exist at all. That is the shape of bug this file's own header
      #      warns about, and it is why the summary below now derives every row from a
      #      step's real outcome.
      #
      # MEASURED, not assumed: on ubuntu-latest (run 37112766189) ANDROID_HOME is
      # /usr/local/lib/android/sdk, so :app-android WAS in the build and the bundle and
      # size gates DID run and measure (a 36.97 MB .aab, 14.60 MB worst-case slice). The
      # SDK-free path below is the fallback, not the normal case — do not read a step
      # named "SDK-free Android proof" being skipped as the Android gates being skipped.
      - name: Detect Android SDK
        id: sdk
        run: |
          set -euo pipefail
          SDK=""
          for candidate in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" \
                           "${RUNNER_TEMP:-/tmp}/android-sdk"; do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then SDK="$candidate"; break; fi
          done
          # compileSdk 35 (app-android/build.gradle.kts). build-tools 35.0.0 is what
          # AGP 8.9.2 resolves for it and is named in AGENTS.md §1; requiring the
          # platform is the load-bearing half, because that is the one whose absence
          # produces a confusing failure rather than an immediate one.
          if [ -n "$SDK" ] && [ ! -d "$SDK/platforms/android-35" ]; then
            echo "::warning title=Android SDK unusable::$SDK exists but has no platforms/android-35 (compileSdk 35). Treating the runner as SDK-free: the Android build, the .aab and the 35 MB size gate will NOT run."
            SDK=""
          fi
          if [ -z "$SDK" ]; then
            # A warning, not a notice. The gates below are SKIPPED, not passed, and the
            # difference has to be visible in the run list without opening the log.
            echo "::warning title=Android modules NOT gated::No usable Android SDK on this runner (checked \$ANDROID_HOME, \$ANDROID_SDK_ROOT, \$RUNNER_TEMP/android-sdk for platforms/android-35). settings.gradle.kts will NOT include :app-android, so the Android build, the .aab, the 35 MB per-device-slice gate and the bundle-manifest gate are SKIPPED — not passed. :ui is NOT affected: it is always in the build."
            echo "::notice::app-android/tools/verify-offline.sh covers what can be covered"
            echo "::notice::without an SDK; see the 'SDK-free Android proof' step."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "reason=no-usable-android-sdk" >> "$GITHUB_OUTPUT"
          else
            echo "sdk.dir=$SDK" > local.properties
            echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
            echo "enabled=true"  >> "$GITHUB_OUTPUT"
            echo "reason=sdk-found" >> "$GITHUB_OUTPUT"
            echo "Android SDK found at $SDK (platforms/android-35 present) — :app-android is in the build."
          fi

      - name: Report toolchain
        run: |
          java -version 2>&1
          ./gradlew --version | sed -n '1,12p'

      # -- 1 ----------------------------------------------------------------
      # Fast logic tests first: BUILD.md's "run before every push" command, and
      # the cheapest signal that the tree even compiles. Every module with a test
      # task runs here, unconditionally — the set is not SDK-dependent and must not
      # become so.
      - name: ':core:jvmTest — fast logic tests'
        id: core-tests
        run: ./gradlew --stacktrace :core:jvmTest

      - name: ':core:allTests — all core targets'
        id: core-all-tests
        run: ./gradlew --stacktrace :core:allTests

      - name: ':platform:jvmTest — crypto/imaging/OCR adapters'
        id: platform-tests
        run: ./gradlew --stacktrace :platform:jvmTest

      # Unconditional on purpose. `:ui` is a plain kotlin-jvm module with no Android and
      # no Compose dependency, so it configures, compiles and tests on a runner with no
      # SDK. Making this step conditional on an SDK would have been the same false
      # assumption the SDK-detection comment used to encode, expressed as behaviour.
      - name: ':ui:test — shared presentation state (not SDK-gated)'
        id: ui-tests
        run: ./gradlew --stacktrace :ui:test

      - name: ':app-desktop:test — Post-Console domain + CLI'
        id: desktop-tests
        run: ./gradlew --stacktrace :app-desktop:test

      - name: ':eval:test — harness unit tests'
        id: eval-tests
        run: ./gradlew --stacktrace :eval:test

      # -- 2 ----------------------------------------------------------------
      # The harness has its own exit-code contract (EVAL.md §3) and CI has to honour it
      # rather than flattening it:
      #
      #   0  PASS        every required suite ran and no gate failed
      #   2  GATE FAILED a gate reported a real regression          -> BUILD MUST FAIL
      #   3  INVALID     the report split is mis-tuned, so the run's numbers cannot be
      #                  compared against the last one                -> BUILD MUST FAIL
      #   4  INCOMPLETE  a required suite was skipped. The device gates
      #                  (Android-vs-desktop parity) are ALWAYS skipped without a device,
      #                  so 4 is the correct and expected result on any runner without
      #                  hardware attached.                                -> MUST NOT FAIL
      #
      # This step used to run `:eval:run smoke` with no continue-on-error, which meant the
      # `verify` job was red on every single run — an always-red gate is worse than no
      # gate, because it is indistinguishable from a real failure and trains everyone to
      # ignore the log. Note what is NOT being claimed: exit 0 must not be the trigger
      # either. A 0 here would mean a device WAS attached (or that the device gates
      # stopped being required), which is a different thing to verify and is reported
      # below rather than asserted.
      #
      # TRAP, and the reason this step is longer than a `case` on `$?`: **the harness's exit
      # code is not observable as `$?` from gradlew.** Gradle runs the harness in a child
      # JVM, reports the child's code in prose on STDERR
      #     > Process 'command '…/java'' finished with non-zero exit value 4
      # and then exits 1 itself for any non-zero child. So a naive
      #     ./gradlew :eval:run --args=smoke; case $? in … 4) ok ;;
      # never sees 4 — it sees 1 — and the build goes red on the one code that is documented
      # as the correct off-device answer. The step therefore captures the log, reads the
      # child's code out of it, and treats a missing/unparseable code as a failure rather than
      # guessing. Verified locally against gradle 8.14.3:
      #     harness exit 4 -> gradlew exit 1 -> "…non-zero exit value 4" on stderr
      - name: ':eval:run smoke — fixtures harness (~60 s), EVAL.md §3 exit codes'
        id: eval_smoke
        run: |
          set -uo pipefail
          log=$(mktemp)
          set +e
          ./gradlew --stacktrace :eval:run --args="smoke" 2>&1 | tee "$log"
          gradle_code=${PIPESTATUS[0]}
          set -e
          if [ "$gradle_code" -eq 0 ]; then
            code=0
          else
            # The child's code, as reported by Gradle on stderr. LAST match, so a
            # stack-trace line that happens to mention an earlier value cannot win.
            code=$(grep -o 'non-zero exit value [0-9]\+' "$log" | tail -n 1 | grep -o '[0-9]\+$' || true)
            code=${code:-none}
          fi
          case "$code" in
            0) status=PASS;       note="every required suite ran and no gate failed" ;;
            2) status=GATE_FAILED; note="a gate reported a real regression" ;;
            3) status=INVALID;    note="report split mis-tuned; run is not comparable to the last one" ;;
            4) status=INCOMPLETE; note="a required suite was skipped (no device attached) — expected off-device" ;;
            *) status=UNKNOWN;    note="harness exit code not recognised (gradlew=$gradle_code, harness=$code)" ;;
          esac
          echo "::notice title=eval smoke — $status (harness exit $code, gradlew exit $gradle_code)::$note"
          echo "eval_status=$status" >> "$GITHUB_OUTPUT"
          echo "eval_exit=$code" >> "$GITHUB_OUTPUT"
          {
            echo "### :eval:run smoke -> $status (harness exit $code, gradlew exit $gradle_code)"
            echo
            echo "$note"
            echo
            echo "Note: gradlew exits 1 whenever the harness exits non-zero, so the harness's own"
            echo "code is read from Gradle's stderr, not from \$?. Exit 4 is INCOMPLETE — a device"
            echo "gate was skipped because no device is attached — and does not fail the build."
            if [ "$code" = "0" ]; then
              echo
              echo "Exit 0 on a runner with no device is unexpected: the device gates are"
              echo "supposed to be skipped, which yields 4. Check that a device gate was not"
              echo "silently made non-required (EVAL.md §3)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f "$log"
          case "$status" in
            PASS|INCOMPLETE)
              echo "eval smoke: $status is not a build failure."
              ;;
            *)
              echo "::error::eval smoke $status (exit $code): $note"
              exit 1
              ;;
          esac

      # -- 3 ----------------------------------------------------------------
      # Hard gate. This is the mechanical form of README principle 1: no verdict
      # path may need a network. Exit 1 prints the offending file:line.
      - name: 'GATE: no network clients in :core (AGENTS.md §5)'
        id: network-ban
        run: ./scripts/check_no_network_in_core.sh

      # -- 4 ----------------------------------------------------------------
      # HARD GATE, and the change from the version that was here before is the whole point of
      # this block.
      #
      # It used to be `continue-on-error: true` with a comment saying "the PII scrubber does
      # not exist in :core yet". That was honest about the state and wrong about the response:
      # an always-red advisory is indistinguishable from a real regression, so it trains
      # everyone to scroll past it — and the *first* thing that goes when people scroll past a
      # gate is the failure it was there to catch. AGENTS.md §1 named this step as a gate, and
      # §4's "no PII in logs" checklist item was aspirational rather than checkable while the
      # scrubber lived only in `:app-desktop`. It lives in `:core` now, with 110 tests of its
      # own, so there is a real thing to be blocking about.
      #
      # NO `continue-on-error` HERE. That is the assertion this step now makes: it can fail the
      # build. The demonstration that it can is in docs/STATUS.md — deleting
      # `core/src/commonMain/.../log/PiiScrubber.kt` makes this step exit 1 with "PII scrubber
      # NOT IMPLEMENTED in :core", and breaking one adversarial test makes the Gradle run exit
      # non-zero. Both were run, not reasoned about.
      #
      # WHAT IT PROVES: the four `:core` scrubber suites ran, each executed at least one test,
      # and each is green — plus the bilingual-string sweep, because a redaction rule with no
      # Hindi line is a build failure and not a demo-day surprise.
      #
      # WHAT IT DOES NOT PROVE, restated in the summary below: that every call site routes
      # through the scrubber. The scrubber is a last line of defence; `PiiScrubber`'s own class
      # comment says why treating it as a first line would make the product worse than having
      # none at all. The step summary row says PASS, not "no PII in logs".
      - name: 'GATE: PII scrubber present, suites ran, suites green (AGENTS.md §4)'
        id: pii-scrubber
        run: |
          set -uo pipefail
          # `set +e` around the capture, and this is not optional. GitHub runs a step body as
          # `bash --noprofile --norc -e -o pipefail {0}`, so `-e` is ALREADY on before this
          # script's first line. Under `-e`, a non-zero exit from the command substitution ends
          # the step on the spot and `code=$?` below is never reached — the step would go red
          # (which is the right colour, by luck) while printing none of the diagnostics that
          # say why, and the FAIL row in the summary would never be written. Same trap the
          # eval-smoke step documents for the harness exit code.
          set +e
          output=$(./scripts/pii_scrubber_test.sh 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 0 ]; then
            echo "::error::pii_scrubber_test.sh exited $code. The PII scrubber is a hard gate: a scrubber that is absent, broken, or silently running zero tests fails the build."
            {
              echo "### PII scrubber: FAIL (exit $code)"
              echo
              echo "The scrubber suites did not all run and pass. This step is blocking."
              echo "A regression here is a privacy incident, not a flake — re-run before"
              echo "assuming otherwise, and do not add an allowlist to get past it (AGENTS.md §8)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi
          suites=$(printf '%s\n' "$output" | grep -cE 'test\(s\) green' || true)
          tests=$(printf '%s\n' "$output" | sed -n 's/^PASS  [0-9]* scrubber suites green — \([0-9][0-9]*\) test.*/\1/p' | head -n 1)
          echo "::notice title=PII scrubber::PASS — $suites suite(s) reported, $tests test(s) executed, all green."
          {
            echo "| PII scrubber (HARD) | PASS — $suites suite(s), $tests test(s) |"
            echo
            echo "The row above means: the scrubber exists in \`:core\`, its four suites ran"
            echo "with a non-zero test count each, and they are green. It does **not** mean"
            echo "\`no PII in logs\` — that is a call-site property no test in this repo can"
            echo "establish. See \`PiiScrubber\`'s class comment for why."
          } >> "$GITHUB_STEP_SUMMARY"


      # -- 5 ----------------------------------------------------------------
      # HARD GATE, promoted 2026-10-03 (decision + date + reason: docs/HANDOFF.md §7).
      #
      # This step was `continue-on-error: true`, and the comment above it used to say the
      # promotion was "a decision the maintainer still has to make". That deferral has run
      # out of reasons: the check PASSES (measured 2026-10-03 — `sh
      # scripts/check_no_magic_thresholds.sh` → exit 0, 69 files scanned, 0 findings), so
      # `continue-on-error` was no longer absorbing a red backlog. It was deferring a
      # decision about a gate that was ready: the script self-tests, fails closed on a
      # broken scanner or an unreadable source file, and cross-checks its allowlist against
      # fusion/thresholds.v1.json in BOTH directions, so neither file can be widened alone.
      # AGENTS.md §2 makes an unregistered number a review fail; the PII-scrubber step above
      # is this workflow's established precedent for a blocking non-lint gate.
      #
      # NO `continue-on-error` HERE. That is the assertion this step now makes: it can fail
      # the build. And the next step does not take that on trust — it injects a literal and
      # requires the failure, so the claim is measured on every run rather than reasoned
      # about once.
      #
      # WHAT IT PROVES: the script exited 0 AND reported what it did. The non-vacuity check
      # below is the same shape as the scrubber step's "ran zero tests is a FAIL, not a
      # pass": a scan that exits 0 having examined no file is a pass in exactly the sense an
      # absent PII control would be one, which is to say it is not one. Exit 2 from the
      # script is a setup/cross-check error and fails here too.
      #
      # WHAT IT DOES NOT PROVE — and the next step measures this end-to-end rather than
      # asserting it: that a tunable added inside one of the file- or package-scoped
      # structural exemptions is caught. It is not. 7 of the 14 script-enforced exemptions
      # match on path rather than on the line, which is 17 file paths where a literal is
      # invisible to this gate. detekt WOULD catch those, and detekt is advisory, still red,
      # and has no notion of a structural exemption — so it cannot be the safety net either.
      # This gate therefore does NOT close the magic-number problem; it closes the part of it
      # that can be closed mechanically, and leaves a named residue for review. Do not read a
      # green row below as "this code has no magic numbers in it".
      #
      # The count is read out of the script's own output rather than written here. The
      # previous version of this step hard-coded "~94 lines", which was wrong on two
      # counts: the real number was larger, and any number written into a workflow file
      # is stale the moment the next commit lands. There is no number in this file.
      - name: 'GATE: no unregistered thresholds in :core (AGENTS.md §2)'
        id: magic-thresholds
        run: |
          set -uo pipefail
          # `set +e` around the capture, and this is not optional. GitHub runs a step body
          # as `bash --noprofile --norc -e -o pipefail {0}`, so `-e` is ALREADY on before
          # this script's first line. Under `-e`, a non-zero exit from the command
          # substitution ends the step on the spot and `code=$?` below is never reached —
          # the step would go red (the right colour, by luck) while printing none of the
          # diagnostics that say why. Same trap the eval-smoke and PII steps document.
          set +e
          output=$(./scripts/check_no_magic_thresholds.sh --max-print 25 2>&1)
          code=$?
          set -e
          echo "$output"
          if [ "$code" -ne 0 ]; then
            echo "::error::check_no_magic_thresholds.sh exited $code. Numeric literals in :core product code that no threshold and no reviewed structural exemption accounts for are a review fail (AGENTS.md §2), and this step is blocking. Register the tunable in fusion/thresholds.v1.json, or record a structural exemption there with a reason and an owner — do NOT edit the script's allowlist, and do not add a baseline (AGENTS.md §8)."
            {
              echo "### Magic thresholds: FAIL (exit $code)"
              echo
              echo "One or more \`:core\` product source lines carry unregistered numeric"
              echo "literals (AGENTS.md §2, FR-R3). This step is blocking. The finding list is"
              echo "in the log above; the count is read out of the script's own output, so it"
              echo "cannot go stale here."
              echo
              echo "The cure is the registry, not the allowlist: either the number is a tunable"
              echo "and belongs in \`fusion/thresholds.v1.json\` with name / default / unit /"
              echo "tuning-data ref / owner, or it is not a tunable and the same file's"
              echo "\`structural\` section is where the reason and the owner go."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

          # Non-vacuity. `|| true` on every parse below is load-bearing: these run under
          # `-e` with `pipefail` already on, so a `grep` that matches nothing would
          # otherwise end the step before the check below could explain itself.
          pass_line=$(printf '%s\n' "$output" | grep -E '^PASS  no unregistered numeric literals' | head -n 1 || true)
          scanned=$(printf '%s\n' "$pass_line" | sed -n 's/.*(\([0-9][0-9]*\) files scanned).*/\1/p' || true)
          if [ -z "$pass_line" ] || [ -z "$scanned" ] || [ "$scanned" -lt 1 ]; then
            echo "::error::check_no_magic_thresholds.sh exited 0 but never reported scanning at least one file ('$pass_line'). An exit 0 that examined nothing is a vacuous pass — the same reason the PII step treats 'ran zero tests' as FAIL."
            {
              echo "### Magic thresholds: FAIL (vacuous pass)"
              echo
              echo "The script exited 0 without reporting a scanned-file count. Something"
              echo "short-circuited the scan, and reporting that as green would be the one"
              echo "outcome this gate exists to prevent (AGENTS.md §8)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          exemptions=$(printf '%s\n' "$output" | sed -n 's/.*+ \([0-9][0-9]*\) registry-declared exemptions\./\1/p' || true)
          echo "::notice title=magic thresholds::PASS — $scanned file(s) scanned, 0 unregistered literals, $exemptions registry-declared structural exemptions in force."
          # No `${{ steps.magic-thresholds.outcome }}` here, and that is deliberate, matching
          # the PII step above: a step cannot read its own outcome from inside its own body —
          # it has none yet — so the row states what was actually measured. The Gate summary
          # step at the end is where the step's outcome is read back.
          {
            echo "| magic thresholds (HARD) | PASS — $scanned file(s) scanned, 0 findings, $exemptions structural exemptions applied |"
            echo
            echo "The row above means: \`scripts/check_no_magic_thresholds.sh\` exited 0 and it"
            echo "examined $scanned source file(s). It does **not** mean \`no magic numbers in"
            echo ":core\`. 7 of the 14 script-enforced structural exemptions match on file or"
            echo "package rather than on the line — 17 file paths where a literal is invisible to"
            echo "this gate. detekt would catch those and is **advisory, still red**, and has no"
            echo "notion of a structural exemption, so it is not a net either. The next step"
            echo "demonstrates the residue end-to-end; \`docs/HANDOFF.md\` §7 records it as a"
            echo "residual gap, not a closed one."
          } >> "$GITHUB_STEP_SUMMARY"

      # -- 5b ---------------------------------------------------------------
      # PROOF THAT THE STEP ABOVE CAN FAIL. A gate nobody has seen fail is not a gate.
      # The PII step above does the same thing by assertion (absent scrubber → exit 1,
      # zero tests → exit 1); this one is proven by mutation instead, because the failure
      # mode here is a false PASS rather than a false negative, and a false pass cannot be
      # asserted into existence — it has to be provoked.
      #
      # HOW IT WORKS, and why it is safe to run in CI: the script derives its repository
      # root from its own location, so a COPY of it in a temp directory, next to a
      # synthetic `core/src/commonMain` tree and a verbatim copy of the real
      # thresholds.v1.json, scans that synthetic tree and nothing else. The checkout is
      # never written to — which is asserted at the end by diffing `git status` before
      # against after. A probe file dropped into the real `core/src/commonMain` would have
      # been the obvious way to do this and is the wrong one: a leaked probe is a Kotlin
      # compile error for every step after it, on a gate that was supposed to be neutral.
      #
      # WHAT IT ASSERTS, in order, and each one separately:
      #   1. the sandbox with NO magic number exits 0 — otherwise "it failed on injection"
      #      proves nothing, because a gate stuck red fails both ways;
      #   2. the sandbox with an injected `0.42` exits NON-ZERO — the gate can fail;
      #   3. that failure is reported as exactly 1 source line, which is the number the
      #      step above parses, so the step's own reporting cannot silently go wrong;
      #   4. the failure names the injected file and line, so a failure cannot be reported
      #      against the wrong place;
      #   5. `git status` is identical before and after.
      # Any of these failing ends the build, because a gate whose negative test cannot be
      # trusted is a gate whose silence means nothing.
      - name: 'PROOF: the magic-threshold gate exits non-zero on an injected literal'
        id: magic-thresholds-negtest
        run: |
          set -uo pipefail
          before=$(git status --porcelain)
          sb=$(mktemp -d "${RUNNER_TEMP:-/tmp}/kasoti-magic-negtest.XXXXXX")
          mkdir -p "$sb/scripts" \
                   "$sb/core/src/commonMain/kotlin/dev/kasoti/fusion" \
                   "$sb/core/src/commonMain/kotlin/dev/kasoti/probe"
          # The real script and the real registry, unmodified. The registry copy is what
          # makes the cross-check in the script run for real rather than short-circuiting.
          cp -p ./scripts/check_no_magic_thresholds.sh "$sb/scripts/"
          cp ./core/src/commonMain/kotlin/dev/kasoti/fusion/thresholds.v1.json \
             "$sb/core/src/commonMain/kotlin/dev/kasoti/fusion/"
          probe="$sb/core/src/commonMain/kotlin/dev/kasoti/probe/Probe.kt"

          # `dev/kasoti/probe/` is a path no structural exemption claims, which is what
          # makes this a test of the GATE and not of an allowlist rule.
          if [ ! -x "$sb/scripts/check_no_magic_thresholds.sh" ]; then
            echo "::error::the copied script is not executable in the sandbox, so the negative test cannot invoke it. cp -p should have preserved the mode bit."
            exit 1
          fi

          write_probe() {
            printf 'package dev.kasoti.probe\n\ninternal object Probe {\n    fun gate(raw: Double): Boolean = raw > %s\n}\n' "$1" > "$probe"
          }

          write_probe '0.0'
          set +e
          # Run the script the way its shebang says to run it. `sh script.sh` forces it under
          # dash on an Ubuntu runner, where `set -o pipefail` is an illegal option and
          # ${BASH_SOURCE[0]} does not resolve -- the script dies before scanning anything, so
          # the sandbox looks broken and this test reports INCONCLUSIVE instead of testing the
          # gate. Every script in scripts/ is `#!/usr/bin/env bash`; invoke them as executables.
          clean_out=$("$sb/scripts/check_no_magic_thresholds.sh" 2>&1)
          clean_rc=$?
          set -e

          write_probe '0.42'
          set +e
          dirty_out=$("$sb/scripts/check_no_magic_thresholds.sh" 2>&1)
          dirty_rc=$?
          set -e
          echo "--- injected-failure output (exit $dirty_rc) ---"
          echo "$dirty_out"
          echo "---------------------------------------------"

          bad=0
          if [ "$clean_rc" -ne 0 ]; then
            echo "::error::negative test is INCONCLUSIVE: a sandbox containing no magic number already failed (exit $clean_rc), so a later failure proves nothing. Output:"
            echo "$clean_out"
            bad=1
          fi
          if [ "$dirty_rc" -eq 0 ]; then
            echo "::error::THE GATE DID NOT FAIL. An injected 0.42 in core/src/commonMain/kotlin/dev/kasoti/probe/Probe.kt was scanned and reported clean. The magic-threshold gate is supposed to be blocking; something has made it vacuous."
            bad=1
          fi
          count=$(printf '%s\n' "$dirty_out" | sed -n 's/^FAIL  \([0-9][0-9]*\) source line(s).*/\1/p' | head -n 1 || true)
          if [ "$count" != "1" ]; then
            echo "::error::expected the injected failure to be reported as exactly 1 source line, got '${count:-no count}'. The blocking step above parses that number out of this line, so a change here would make its summary lie."
            bad=1
          fi
          if ! printf '%s\n' "$dirty_out" | grep -q 'probe/Probe.kt:4'; then
            echo "::error::the injected failure did not name core/src/commonMain/kotlin/dev/kasoti/probe/Probe.kt:4, so it cannot be shown to have failed on the right line."
            bad=1
          fi
          rm -rf "$sb"

          after=$(git status --porcelain)
          if [ "$before" != "$after" ]; then
            echo "::error::this negative test modified the checkout. It is supposed to run entirely in a temp directory."
            diff <(printf '%s\n' "$before") <(printf '%s\n' "$after") || true
            bad=1
          fi

          if [ "$bad" -ne 0 ]; then
            {
              echo "### Magic-threshold negative test: FAIL"
              echo
              echo "The gate above is blocking, and this run could not demonstrate that it"
              echo "fails. See the \`::error::\` annotations in the log."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::notice title=magic-threshold negative test::PASS — clean sandbox exit 0; injected 0.42 exit $dirty_rc, reported as $count source line at probe/Probe.kt:4. Checkout unmodified."
          {
            echo "| magic-threshold negative test | PASS — gate exits $dirty_rc on an injected literal; clean tree exits $clean_rc |"
            echo
            echo "Proven on this run, both directions: the gate is green on a tree with no"
            echo "magic numbers and red on a tree with one. Nothing about it is assumed."
          } >> "$GITHUB_STEP_SUMMARY"

      # -- 6 ----------------------------------------------------------------
      # ktlint and detekt are WIRED (root build.gradle.kts applies both plugins to
      # :core/:platform/:app-desktop/:eval/:ui), so `ktlintCheck` and `detekt` are real
      # Gradle tasks and the detection below finds them. The guard is kept anyway: it is
      # the difference between "this ran and is red" and "this did not run", and the two
      # are indistinguishable from the outside if the guard is removed.
      #
      # ADVISORY, and the reason is stated rather than hidden: both default rulesets are
      # red on day one (thousands of ktlint formatting findings across the tree, and ~1.3k
      # detekt findings of which three quarters are MagicNumber). Turning either into a
      # blocking gate now would make `verify` permanently red for a reason unrelated to
      # the change under test, which is how a maintainer learns to ignore a gate. Neither
      # ruleset has been weakened to get here — no rule is switched off, no baseline is
      # committed — and the build does not depend on either task (root build.gradle.kts
      # detaches them from `check` for the same reason).
      #
      # The finding counts below are read from the tools' own reports. What this step
      # promises is narrow and true: the analysis runs, its output is in the log, and the
      # number in the job summary is the number the tool produced.
      # AGENTS.md §1 carries the TODO for turning these into blocking gates.
      - name: 'Lint (advisory): ktlintCheck + detekt — wired, backlogs not yet cleared'
        id: lint
        # NO `continue-on-error` HERE, and the reason is narrow and worth stating because
        # "lint is advisory" is easy to misread as "this step cannot fail".
        #
        # This step already ends in an explicit `exit 0` on the red-backlog path (below),
        # so on every ordinary run it succeeds whether or not ktlint and detekt found
        # anything. `continue-on-error: true` therefore bought nothing — except that it
        # ALSO swallowed the one real failure this step contains: the guard that exits 1
        # when a lint task does not exist at all, i.e. when the plugin is not applied and
        # "this ran and is red" has become "this did not run". The step's own comment
        # already says the guard "is the difference between 'this ran and is red' and
        # 'this did not run', and the two are indistinguishable from the outside if the
        # guard is removed" — the `continue-on-error` was doing precisely that removal,
        # because GitHub reports a continued-on-error step's conclusion as `success`
        # whatever happened inside it. Same defect as the bundle-manifest step had.
        #
        # So removing it weakens nothing: the backlog stays advisory and non-blocking, and
        # a missing plugin now fails the build. AGENTS.md §1's TODO for turning the
        # findings themselves into blocking gates is untouched.
        run: |
          set -uo pipefail
          missing=0
          ran=0
          declare -a rows=()
          for task in ktlintCheck detekt; do
            if ./gradlew -q help --task "$task" >/dev/null 2>&1; then
              ran=$((ran + 1))
              echo "::group::$task"
              set +e
              ./gradlew --stacktrace "$task"
              set -e
              echo "::endgroup::"
            else
              missing=$((missing + 1))
              echo "::warning title=Lint::$task is not a Gradle task in this tree — the plugin is not applied."
            fi
          done

          # ktlint writes one .txt per source-set check task, and colours each line with ANSI
          # escapes, so the escapes have to come off before anything can be counted. Each
          # finding is then one line starting with the absolute path of the file it is in.
          ktlint_count=0
          for f in */build/reports/ktlint/*/ktlint*Check.txt; do
            [ -f "$f" ] || continue
            n=$(sed 's/\x1b\[[0-9;]*m//g' "$f" | grep -c '^/' || true)
            ktlint_count=$((ktlint_count + n))
          done
          # detekt writes one Checkstyle XML per module; each <error> is one finding.
          detekt_count=0
          for f in */build/reports/detekt/detekt.xml; do
            [ -f "$f" ] || continue
            n=$(grep -c '<error' "$f" || true)
            detekt_count=$((detekt_count + n))
          done

          echo "::notice title=Lint summary::tasks found: $ran/2 · ktlint findings: $ktlint_count · detekt findings: $detekt_count"
          rows+=("| ktlintCheck (advisory) | $ktlint_count findings |")
          rows+=("| detekt (advisory) | $detekt_count findings |")
          {
            echo "| lint: ktlintCheck (advisory) | $ktlint_count finding(s) |"
            echo "| lint: detekt (advisory) | $detekt_count finding(s) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$missing" -ne 0 ]; then
            echo "::error::$missing of 2 lint task(s) do not exist. The plugins are declared in the root build script; this is a real gap, not a red backlog."
            exit 1
          fi
          cat <<'EOF'
          NOTE: lint RAN. It is not green, and no rule was disabled to make it look green.
            · ktlint: the ktlint_official ruleset disagrees with how this tree is written
              (`function-signature`, `multiline-expression-wrapping`, `argument-list-wrapping`
              account for most of it). `./gradlew ktlintFormat` rewrites them all in one
              pass, which is a whole-tree reformat and needs its own PR.
            · detekt: ~71% of the findings are MagicNumber, i.e. the numbers AGENTS.md §2
              wants in fusion/thresholds.v1.json. That file now EXISTS (49 thresholds, plus a
              `structural` section for the numbers that are provably not tunables), and
              scripts/check_no_magic_thresholds.sh — which reads that file and passes — is
              green. detekt is not, and will not become green from this alone: it has no notion
              of a structural exemption, so the literals the registry vouches for are still
              red there. The two tools overlap and do not agree on a total for the same code
              (detekt counts literals; the script counts lines).
            Both are tracked in AGENTS.md §1. Until they are cleared, treat these counts
            as a direction of travel, not as a pass.
          EOF
          # Advisory: deliberately exit 0. The findings are above, in the log, and in the
          # job summary. Failing here on a known backlog is what this step is not for.
          exit 0

      # -- 7 ----------------------------------------------------------------
      # SDK-FREE ANDROID PROOF — the highest-value Android gate available on a runner
      # with no SDK, and the only thing in this workflow that looks at the Android
      # source at all in that case.
      #
      # `app-android/tools/verify-offline.sh` compiles the SDK-free half of `:app-android`
      # and all of `:ui` with the pinned Kotlin 2.1.21 compiler against the real `:core`
      # classes, and runs their unit tests on a bare JVM.
      #
      # WHAT IT PROVES: the pure layer of the field app compiles; its unit tests pass; every
      # `:core` API it calls exists with the signature it uses; the Android face-detector
      # decode is bit-identical to the desktop one, which is half of DESIGN.md §3's
      # comparability law.
      #
      # WHAT IT DOES NOT PROVE: anything importing `android.*`, `androidx.*`,
      # `org.tensorflow.*` or `com.google.mlkit.*`; resources, the manifest, Gradle
      # configuration, dependency resolution, R8, aapt2, the Compose compiler; or that the
      # app runs. The script's own header says this too, and that is the point of quoting
      # it here — a green run from this step is NOT a green Android build.
      #
      # It runs only when there is no SDK, because with an SDK the real Gradle build and
      # the bundle-size gate are the better evidence. Running both would be redundant, not
      # stronger: the two compile different subsets.
      - name: 'SDK-free Android proof (verify-offline.sh) — no SDK on this runner'
        id: sdk_free_android
        if: steps.sdk.outputs.enabled != 'true'
        run: |
          set -uo pipefail
          set +e
          ./app-android/tools/verify-offline.sh
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::verify-offline.sh failed with exit $code. This is the ONLY step in this workflow that checks the Android source on an SDK-less runner, so a failure here is a real failure and not a skip."
            exit 1
          fi
          echo "::notice title=SDK-free Android proof::PASSED for the SDK-free layer only. It does not prove aapt2, R8, resource merging, dependency resolution or on-device behaviour."
          echo "| Android SDK-free proof (verify-offline.sh) | PASS (SDK-free layer only) |" >> "$GITHUB_STEP_SUMMARY"

      # -- 8 ----------------------------------------------------------------
      # App-bundle delivery + the size gate (BUILD.md §3: worst-case per-device
      # download <= 35 MB).
      # Only meaningful when an SDK exists; otherwise this step is skipped and
      # the job summary says so. Skipping is NOT passing.
      #
      # CHANGED 2026-10-03 (a second time, in the opposite direction — the first change
      # was a regression and this reverts it):
      #
      #  1. This step used to run `:app-android:bundleRelease` and then re-implement the size
      #     arithmetic in shell over `outputs/**/*.aab`.
      #  2. It then stopped doing that, because `:app-android:bundleRelease` could not run at
      #     all: AGP cannot apply `splits.abi` and build an app bundle in the same module. With
      #     `splits.abi.isEnable = true` the bundle task died with
      #         Execution failed for task ':app-android:buildReleasePreBundle'.
      #         > Sequence contains more than one matching element.
      #           at com.android.build.gradle.internal.tasks.PerModuleBundleTask
      #              .getResourcesFile(PerModuleBundleTask.kt:565)
      #     so delivery became APK-only and this step delegated to `:app-android:checkApkSize`.
      #  3. `splits.abi` is now OFF (decision recorded in docs/HANDOFF.md §7, dated 2026-10-03).
      #     Splits and bundles are mutually exclusive *by design* — present in AGP 8.9.2 through
      #     8.13.2, which only replaces the crash with an explicit "disable building multiple APKs
      #     when building an Android app bundle" message — so `bundleRelease` runs again and the
      #     `.aab` is the delivery artifact once more.
      #
      # So this step builds the bundle and delegates the whole decision, including the arithmetic,
      # to the module's own gate. The budget is unchanged at 35 MB, it is still HARD, and the
      # METRIC changed: it is applied to the bundle's worst-case per-device slice (the compressed
      # bytes one phone downloads), not to any container's file size. Measured 2026-10-03:
      # container 36.97 MB, worst slice 14.60 MB. See the ADR in app-android/build.gradle.kts.
      #
      # The shell below therefore does NOT re-measure sizes — it asserts two things the gate
      # cannot assert about its own run: that `checkApkSize` exited 0, and that a `.aab` really
      # exists afterwards. Re-implementing the metric here is exactly the duplication that made
      # this step measure "whichever file the `**` glob left last" (AGENTS.md §5: a gate that
      # measures a different quantity from the one it claims is not a gate).
      - name: 'GATE: Android app bundle built + worst-case per-device slice <= 35 MB'
        id: android_size_gate
        if: steps.sdk.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          # checkApkSize dependsOn bundleRelease/assembleRelease/assembleDebug and prints one
          # line per container: its file size AND the worst-case per-device slice it gates.
          # Its failure IS the gate failure, so `set -e` here is the assertion.
          #
          # Capture rather than stream: the two non-vacuity checks below parse this task's
          # OWN output, and a grep over a pipe that Gradle is still writing into is a race.
          # `set +e` around the capture is the same trap the eval-smoke, PII and
          # magic-threshold steps document — GitHub runs a step body with `-e` already on.
          set +e
          out=$(./gradlew --stacktrace :app-android:checkApkSize 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          if [ "$code" -ne 0 ]; then
            echo "::error:::app-android:checkApkSize exited $code. This is the 35 MB worst-case per-device-slice gate for the shipping artefact and it is blocking; the size table above is the measurement it made before failing."
            {
              echo "### Android size gate: FAIL (exit $code)"
              echo
              echo "\`:app-android:checkApkSize\` is the gate. Its output is in the log above;"
              echo "the per-container table it prints is the measurement, not an estimate."
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

          # Non-vacuity, and the reason this step is not just `set -e`. checkApkSize
          # exiting 0 proves it did not exceed the budget; it does not prove it measured
          # anything. An earlier version of this step was `./gradlew :app-android:checkApkSize`
          # and nothing else, so a gate that reported success having found no container at
          # all would have been indistinguishable from a real pass — which is the failure
          # mode the PII step calls out for "ran zero tests" and the magic-threshold step
          # for "exited 0 but scanned nothing". Two assertions close it:
          measured=$(printf '%s\n' "$out" | sed -n 's/^KASOTI size gate: \([0-9][0-9]*\) container(s) measured\..*/\1/p' | head -n 1)
          if [ -z "$measured" ] || [ "$measured" -lt 1 ]; then
            echo "::error::checkApkSize exited 0 but never reported 'KASOTI size gate: N container(s) measured.' with N >= 1 (got '${measured:-no count}'). An exit 0 that measured no artefact is a vacuous pass — the gate exists to bound the bytes one phone downloads, and a pass that bounds nothing is not a pass."
            exit 1
          fi

          AAB=$(find app-android/build/outputs/bundle/release -name '*.aab' -type f | sort)
          if [ -z "$AAB" ]; then
            echo "::error::no .aab under app-android/build/outputs/bundle/release — bundle delivery is the shipping path and checkApkSize depends on bundleRelease, so this is a real failure, not a skip."
            {
              echo "### Android delivery: FAIL — checkApkSize passed but no .aab was produced."
              echo
              echo "The gate measured $measured container(s) but the release bundle is missing"
              echo "from \`app-android/build/outputs/bundle/release\`. Delivery is the .aab"
              echo "(ADR in app-android/build.gradle.kts), so this is not a reporting quirk."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          # And the gated metric itself, per delivery artefact. checkApkSize prints one
          # "is within budget" / advisory line per container; require the .aab's.
          if ! printf '%s\n' "$out" | grep -q 'bundle/app-android-release\.aab is within budget'; then
            echo "::error::checkApkSize exited 0 but never reported 'bundle/app-android-release.aab is within budget'. Without that line there is no evidence the DELIVERY artefact was the one measured to budget; a pass on some other container is not a pass on the shipping one."
            exit 1
          fi
          {
            echo "### Android delivery — GATE PASSED"
            echo
            echo "$measured container(s) measured by \`:app-android:checkApkSize\`; the full table"
            echo "with each container's size and worst-case per-device slice is in the log."
            echo
            echo "| artifact | file size |"
            echo "|---|---|"
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              MB=$(awk -v b="$(stat -c %s "$f")" 'BEGIN{printf "%.2f", b/1048576}')
              echo "- \`$(basename "$f")\` — ${MB} MB (container; the gate applies to the per-device slice, printed by \`:app-android:checkApkSize\` above)"
            done <<< "$AAB"
            echo
            echo "Debug APKs are built and measured too, and reported as an ADVISORY rather"
            echo "than gated, because \`buildTypes\` sets \`isMinifyEnabled = false\` for debug."
            echo "The numbers and the reason are in the \`checkApkSize\` KDoc in"
            echo "app-android/build.gradle.kts; they are deliberately not restated here,"
            echo "because a figure written into a workflow file is stale the moment the next"
            echo "commit lands (this file's header, rule 2)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "OK: app bundle built; worst-case per-device slice within 35 MB (gate above)."

      # ---------------------------------------------------------------------
      # BUNDLE MANIFEST INTEGRITY — invariant I12 / AT-12 "model swap".
      #
      # THIS STEP WAS A GATE THAT COULD NOT FAIL AND REPORTED `success` ANYWAY. It is
      # the one real instance of that bug in this workflow, and the evidence is in run
      # 37112766189:
      #
      #   * `continue-on-error: true` was set on it, so its non-zero exit was reported as
      #     step conclusion `success` by the API while the log carried
      #         FAIL: manifest '.../bundle_manifest.sample.txt' is NOT populated — 2 placeholder hash(es).
      #         ##[error]Process completed with exit code 1.
      #     A green run, on a run whose own log says the gate failed.
      #   * it wrote nothing to the job summary, so there was not even a misleading row —
      #     the gate was simply absent from the report while nominally part of it.
      #
      # And it could not have been otherwise: `scripts/bundle_manifest.sample.txt` pins one
      # real artefact and carries two REPLACE_ME placeholders *by design* (the embedding
      # model was rejected on licence grounds — a recorded decision, THIRD_PARTY.md), and
      # the one real entry, `eval/models/blazeface_short.tflite`, is git-ignored
      # (.gitignore:53) so it is absent from a fresh CI checkout even before that. So the
      # gate was pointed at a subject that cannot exist on this runner, and its real
      # failure was masked.
      #
      # FIXED, in the shape the PII and magic-threshold steps already use — a gate that
      # cannot verify its subject must say so out loud:
      #   * `continue-on-error` is gone. Nothing masks this step now.
      #   * `scripts/ci_bundle_manifest_gate.sh` (new) runs the real `verify_bundle.sh`,
      #     unmodified, and reports WHICH of two very different states occurred, on
      #     distinct exit codes: 3 = NOT_SATISFIED (no hash was compared) versus
      #     1 = FAILED (a populated manifest did not verify) versus 2 = setup error.
      #     There is no code path in it that turns "compared nothing" into "passed".
      #   * 1 and 2 fail the build. 3 reports SKIPPED — NOT SATISFIED, in a warning, in a
      #     bold summary row, and in this step's own name, because GitHub gives a running
      #     step no way to mark itself skipped. That is the honest disposition: a truthful
      #     SKIP, never a false SUCCESS.
      #   * The step name carries the state so the run list is readable without the log.
      #
      # WHY 3 IS NOT SIMPLY MADE BLOCKING: invariant I12 would then be red on every push
      # forever, for a reason no agent can resolve (the weights are not obtainable). The
      # file's own reasoning at the eval-smoke step applies — "an always-red gate is worse
      # than no gate, because it is indistinguishable from a real failure and trains
      # everyone to ignore the log". The honest middle is a gate that cannot be mistaken
      # for a pass. Promoting NOT_SATISFIED to blocking is a maintainer decision and
      # belongs in docs/HANDOFF.md §7 with a date and a reason (AGENTS.md §9); it is not
      # taken here.
      # ---------------------------------------------------------------------
      - name: 'GATE: bundle manifest integrity (invariant I12 / AT-12 model swap)'
        id: bundle_manifest_gate
        if: steps.sdk.outputs.enabled == 'true'
        run: |
          set -uo pipefail
          set +e
          out=$(./scripts/ci_bundle_manifest_gate.sh 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"

          case "$code" in
            0)
              # Non-vacuity again, at this level: the classifier already refuses an exit 0
              # that hashed nothing (it reports SETUP_ERROR instead), but the count is
              # restated into the summary here so the row cannot read as a bare "pass".
              n=$(printf '%s\n' "$out" | sed -n 's/^STATE: VERIFIED — \([0-9][0-9]*\) file(s).*/\1/p' | head -n 1)
              echo "bundle_manifest_state=VERIFIED" >> "$GITHUB_OUTPUT"
              echo "::notice title=bundle manifest::VERIFIED — $n file(s) hashed and matched their pinned SHA-256."
              {
                echo "| bundle manifest integrity (I12 / AT-12) | PASS — $n file(s) hashed, all matched |"
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            3)
              # The state that used to be reported as `success`.
              #
              # NOTE this branch exits 0, and that is the whole difficulty: GitHub gives a
              # running step no way to mark itself skipped, so `steps.bundle_manifest_gate
              # .outcome` is `success` here and CANNOT be used as evidence of anything. The
              # step therefore publishes `bundle_manifest_state`, and the Gate summary reads
              # that rather than the outcome — an earlier draft of this fix printed the
              # outcome and would have written "success" for a gate that compared no hashes,
              # i.e. the original bug one row over.
              echo "bundle_manifest_state=NOT_SATISFIED" >> "$GITHUB_OUTPUT"
              echo "::warning title=bundle manifest NOT SATISFIED::No hash was compared, so invariant I12 (AT-12, model swap) is NOT enforced by this run. scripts/bundle_manifest.sample.txt still carries REPLACE_ME placeholders by design (the embedding model was rejected on licence grounds — THIRD_PARTY.md), and eval/models/**/*.tflite is git-ignored (.gitignore:53) so the pinned detector is absent from a fresh CI checkout. This is a truthful SKIP, not a pass. To make it a pass: scripts/fetch_models.sh, then scripts/verify_bundle.sh --init once the weights exist and provenance is recorded."
              {
                echo "| bundle manifest integrity (I12 / AT-12) | **SKIPPED — NOT SATISFIED.** No hash was compared. |"
                echo
                echo "This row is the honest state of invariant I12 on this run, and it is the"
                echo "defect this step was carrying: until 2026-10-03 the same condition was"
                echo "reported \`success\`, because the step had \`continue-on-error: true\` over a"
                echo "manifest that cannot be populated in CI. A green row here would assert"
                echo "something nobody measured."
                echo
                echo "Two independent reasons the gate cannot run here, both by design:"
                echo "1. \`scripts/bundle_manifest.sample.txt\` carries two \`REPLACE_ME\` placeholders."
                echo "   \`emb_v1.tflite\` was rejected on licence grounds after seven candidates"
                echo "   (docs/spikes/01-face-model.md §2.1, THIRD_PARTY.md) — a recorded"
                echo "   decision, not an open gap."
                echo "2. The one real entry, \`eval/models/blazeface_short.tflite\`, is git-ignored"
                echo "   (\`.gitignore:53\`) and therefore absent from a fresh CI checkout. So even a"
                echo "   fully populated manifest would verify nothing on this runner."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "bundle manifest: NOT_SATISFIED — no hash compared, reported as SKIPPED, not as a pass."
              ;;
            1|2)
              echo "::error::bundle manifest gate FAILED (ci_bundle_manifest_gate.sh exit $code). A populated bundle manifest did not verify every pinned file — this is invariant I12 / AT-12 'model swap' (THREAT_MODEL.md §3). The per-file report is above. Do NOT demo and do NOT deploy. If a hash legitimately changed, get it signed off before refreshing the manifest (THIRD_PARTY.md); do not edit the manifest to make this step green."
              {
                echo "| bundle manifest integrity (I12 / AT-12) | **FAIL (exit $code)** — pinned hash mismatch or unreadable verdict |"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
              ;;
            *)
              echo "::error::ci_bundle_manifest_gate.sh exited $code, which is not one of its documented codes (0 verified / 1 failed / 2 setup error / 3 not satisfied). Treating an unrecognised code as anything but a failure is how this gate went green in the first place."
              exit 1
              ;;
          esac

      # ---------------------------------------------------------------------
      # PROOF THAT THE STEP ABOVE CAN FAIL. The same argument as the magic-threshold
      # negative test, and for the same reason: this gate's failure mode is a false
      # SUCCESS, and a false success cannot be asserted into existence — it has to be
      # provoked. It WAS a false success (see above), so this step is the one that stops
      # it coming back.
      #
      # WHAT IT ASSERTS, each separately, because each catches a different wrong answer:
      #   1. a populated manifest over an untouched file exits 0 — otherwise "it failed on
      #      tampering" proves nothing, since a gate stuck red fails both ways;
      #   2. the SAME file, tampered on disk after the manifest was pinned, exits NON-ZERO.
      #      This is the actual attack: RT-E8 / AT-12 "model swap", where the pinned hash is
      #      untouched and only the bytes on disk change. Asserting on a hand-written wrong
      #      hash instead would test the manifest parser, not the invariant;
      #   3. that failure is reported as FAILED, i.e. distinct from the NOT_SATISFIED path
      #      the step above takes today — so promoting this gate later cannot silently
      #      reclassify today's skip as a pass;
      #   4. an UNPOPULATED manifest exits 3, NOT 0 — the exact confusion that made this
      #      gate report success on run 37112766189, now asserted in both directions;
      #   5. `git status` is identical before and after.
      #
      # HOW IT WORKS, and why it is safe to run in CI: both scripts derive their repository
      # root from their own location, so COPIES of them in a temp directory, next to a
      # synthetic asset, operate entirely on that synthetic tree. The real manifest and the
      # real model are never touched — asserted by (5).
      # ---------------------------------------------------------------------
      - name: 'PROOF: the bundle-manifest gate fails on a swapped model, and skips on an unpopulated manifest'
        id: bundle-manifest-negtest
        run: |
          set -uo pipefail
          before=$(git status --porcelain)
          sb=$(mktemp -d "${RUNNER_TEMP:-/tmp}/kasoti-bundle-negtest.XXXXXX")
          mkdir -p "$sb/scripts" "$sb/assets"
          cp -p ./scripts/verify_bundle.sh "$sb/scripts/"
          cp -p ./scripts/ci_bundle_manifest_gate.sh "$sb/scripts/"

          if [ ! -x "$sb/scripts/ci_bundle_manifest_gate.sh" ] || [ ! -x "$sb/scripts/verify_bundle.sh" ]; then
            echo "::error::a copied gate script is not executable in the sandbox, so the negative test cannot invoke it. cp -p should have preserved the mode bit."
            exit 1
          fi

          printf 'the real detector weights\n' > "$sb/assets/face.tflite"
          good=$(sha256sum "$sb/assets/face.tflite" | awk '{print $1}')
          printf '%s  assets/face.tflite\n' "$good" > "$sb/manifest.txt"
          printf 'REPLACE_ME  assets/face.tflite\n' > "$sb/unpopulated.txt"

          # (1) clean, populated, honest bytes -> 0. Invoked as an executable, not via
          # `sh script.sh`: every script in scripts/ is `#!/usr/bin/env bash`, and forcing
          # one under dash breaks `set -o pipefail` and ${BASH_SOURCE[0]} on an Ubuntu
          # runner — the same trap the magic-threshold negative test documents.
          set +e
          clean_out=$("$sb/scripts/ci_bundle_manifest_gate.sh" --root "$sb" --manifest "$sb/manifest.txt" 2>&1)
          clean_rc=$?
          # (2) MODEL SWAP: the manifest still pins the original hash; only the bytes on
          # disk change. This is RT-E8 / AT-12.
          printf 'attacker-substituted-weights\n' > "$sb/assets/face.tflite"
          swapped_out=$("$sb/scripts/ci_bundle_manifest_gate.sh" --root "$sb" --manifest "$sb/manifest.txt" 2>&1)
          swapped_rc=$?
          # (4) unpopulated -> 3, and specifically NOT 0.
          unpop_out=$("$sb/scripts/ci_bundle_manifest_gate.sh" --root "$sb" --manifest "$sb/unpopulated.txt" 2>&1)
          unpop_rc=$?
          set -e
          echo "--- model-swap output (exit $swapped_rc) ---"
          printf '%s\n' "$swapped_out"
          echo "--------------------------------------------"

          bad=0
          if [ "$clean_rc" -ne 0 ]; then
            echo "::error::negative test is INCONCLUSIVE: a populated manifest over an untouched file already failed (exit $clean_rc), so a later failure proves nothing. Output:"
            printf '%s\n' "$clean_out"
            bad=1
          fi
          if [ "$swapped_rc" -eq 0 ]; then
            echo "::error::THE GATE DID NOT FAIL ON A SWAPPED MODEL. The manifest pins $good and the bytes on disk were replaced, and ci_bundle_manifest_gate.sh still exited 0. Invariant I12 / AT-12 'model swap' is the runtime guard for every downstream verdict; a gate that waves this through is worse than no gate."
            bad=1
          fi
          if ! printf '%s\n' "$swapped_out" | grep -q '^STATE: FAILED'; then
            echo "::error::the swap was rejected (exit $swapped_rc) but not reported as 'STATE: FAILED', so it cannot be told apart from a setup error by the step above — which means a skip and a real integrity failure could be reported the same way."
            bad=1
          fi
          if [ "$unpop_rc" -eq 0 ]; then
            echo "::error::THE GATE REPORTED SUCCESS ON AN UNPOPULATED MANIFEST (exit 0). This is the exact defect of run 37112766189: a manifest with no real hash in it was reported as a verified bundle. It must exit 3 and be reported as SKIPPED — NOT SATISFIED."
            bad=1
          fi
          if [ "$unpop_rc" -ne 3 ]; then
            echo "::error::an unpopulated manifest exited $unpop_rc; expected 3 (NOT_SATISFIED). The classifier's whole job is to keep 'compared nothing' off the success path, and an unrecognised code would be handled as a failure by the step above, which would hide that."
            bad=1
          fi
          rm -rf "$sb"

          after=$(git status --porcelain)
          if [ "$before" != "$after" ]; then
            echo "::error::this negative test modified the checkout. It is supposed to run entirely in a temp directory."
            diff <(printf '%s\n' "$before") <(printf '%s\n' "$after") || true
            bad=1
          fi

          if [ "$bad" -ne 0 ]; then
            {
              echo "### Bundle-manifest negative test: FAIL"
              echo
              echo "The gate above cannot be shown to fail a model swap, or cannot be shown to"
              echo "refuse an unpopulated manifest. See the \`::error::\` annotations in the log."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "::notice title=bundle-manifest negative test::PASS — clean populated manifest exit $clean_rc; the same file swapped on disk exit $swapped_rc reported as FAILED; an unpopulated manifest exit $unpop_rc reported NOT SATISFIED. Checkout unmodified."
          {
            echo "| bundle-manifest negative test | PASS — swapped model exits $swapped_rc; unpopulated manifest exits $unpop_rc (NOT success) |"
            echo
            echo "Proven on this run, both directions: the gate is green on bytes that match"
            echo "their pin and red on bytes that do not, and it refuses to call an unpinned"
            echo "manifest a pass. The second is the defect this run of CI was found to have."
          } >> "$GITHUB_STEP_SUMMARY"

      # -- 9 ----------------------------------------------------------------
      # EVERY ROW IS A REAL OUTCOME. The version this replaces hard-coded three claims,
      # and every one of them was false or misleading on the first green run:
      #
      #   * the Android row said "run" or "SKIPPED — no SDK" based on the DETECTION
      #     result, not on the gate's outcome — so it read "run" whether the size gate
      #     passed, failed, or was skipped, and there was no `id` on the size-gate step
      #     for it to have read anything else;
      #   * it repeated "no `.aab`: AGP 8.9.2 cannot bundle with ABI splits on", which
      #     stopped being true when `splits.abi` was removed (ADR in
      #     app-android/build.gradle.kts) — run 37112766189 built a 36.97 MB .aab;
      #   * it carried no row at all for the bundle-manifest gate, the one step in the
      #     job that had genuinely failed while reporting `success`;
      #   * it asserted in bold that "No CI run has ever happened against this tree:
      #     there is no git remote and no runner". There is a remote, and run 37112766189
      #     is green. A workflow that denies its own existence is worse than one that
      #     over-claims: it teaches a reader to distrust every other line of the report.
      #
      # The `not run` fallbacks are load-bearing. `steps.<id>.outcome` is the empty string
      # when a step never started (an earlier failure, or an `if:` that was false), and an
      # empty cell in this table is indistinguishable from a rendered blank — so SKIPPED,
      # "not run" and the verdict text all have to be explicit.
      - name: Gate summary
        id: gate_summary
        if: always()
        run: |
          # `steps.<id>.outcome` is the verdict BEFORE continue-on-error; `conclusion` is
          # what the run reports. Every step that can fail now has no continue-on-error,
          # so the two agree for all of them — which is what makes `outcome` the right
          # thing to print here rather than the more forgiving `conclusion`.
          sdk_state="${{ steps.sdk.outputs.enabled }}"
          if [ "$sdk_state" = "true" ]; then
            android_row_note="Android SDK present, so :app-android was in the build."
          else
            android_row_note="**No usable Android SDK on this runner** (reason: ${{ steps.sdk.outputs.reason }}). The Android build, the .aab and the 35 MB per-device-slice gate did NOT run on this push."
          fi
          {
            echo "## CI gate summary"
            echo
            echo "| Gate | Result |"
            echo "|---|---|"
            echo "| :core:jvmTest | ${{ steps.core-tests.outcome || 'not run' }} |"
            echo "| :core:allTests | ${{ steps.core-all-tests.outcome || 'not run' }} |"
            echo "| :platform:jvmTest | ${{ steps.platform-tests.outcome || 'not run' }} |"
            echo "| :ui:test (not SDK-gated) | ${{ steps.ui-tests.outcome || 'not run' }} |"
            echo "| :app-desktop:test | ${{ steps.desktop-tests.outcome || 'not run' }} |"
            echo "| :eval:test | ${{ steps.eval-tests.outcome || 'not run' }} |"
            echo "| :eval:run smoke | ${{ steps.eval_smoke.outputs.eval_status || 'not run' }} (harness exit ${{ steps.eval_smoke.outputs.eval_exit || 'n/a' }}) |"
            echo "| network-ban in :core (HARD) | ${{ steps.network-ban.outcome || 'not run' }} |"
            echo "| PII scrubber (HARD) | ${{ steps.pii-scrubber.outcome || 'not run' }} — suites ran and are green; NOT a claim that no call site logs PII |"
            echo "| magic thresholds (HARD) | ${{ steps.magic-thresholds.outcome || 'not run' }} — a finding fails the build; NOT a claim that :core has no magic numbers (7 file-scoped exemptions) |"
            echo "| magic-threshold negative test | ${{ steps.magic-thresholds-negtest.outcome || 'not run' }} — injected literal must fail the gate |"
            echo "| ktlintCheck / detekt | ADVISORY — ${{ steps.lint.outcome || 'not run' }}; finding counts in their own rows above |"
            echo "| Android SDK-free proof (verify-offline.sh) | ${{ steps.sdk_free_android.outcome || 'not run' }} — $([ "${{ steps.sdk_free_android.outcome }}" = "skipped" ] && echo 'correctly skipped: the real Gradle build is stronger evidence and :app-android WAS in the build' || echo 'ran') |"
            echo "| Android .aab + worst-case per-device slice <= 35 MB (HARD) | ${{ steps.android_size_gate.outcome || 'not run' }} — $android_row_note |"
            echo "| bundle manifest integrity (I12 / AT-12) | ${{ steps.bundle_manifest_gate.outputs.bundle_manifest_state || 'not run' }} — step outcome \`${{ steps.bundle_manifest_gate.outcome || 'n/a' }}\`, but read the STATE, not the outcome: NOT_SATISFIED means no hash was compared, and a SKIP is not a pass |"
            echo "| bundle-manifest negative test | ${{ steps.bundle-manifest-negtest.outcome || 'not run' }} — a swapped model must fail the gate; an unpopulated manifest must not pass |"
            echo
            echo "### What this run did NOT establish"
            echo
            echo "Listed explicitly, because a gate that verifies nothing is worse than no gate,"
            echo "and the only honest way to say that is to say it:"
            echo
            if [ "$sdk_state" != "true" ]; then
              echo "- **The shipping artefact was not size-gated on this push.** No Android SDK on"
              echo "  the runner, so \`:app-android:bundleRelease\` and \`:app-android:checkApkSize\`"
              echo "  were SKIPPED. Nothing here says the .aab fits in 35 MB."
            else
              echo "- The .aab was built and its worst-case per-device slice measured against the"
              echo "  35 MB budget. This says nothing about a **universal** APK (not built) or about"
              echo "  Play's own delivery-side transformations."
            fi
            echo "- **Invariant I12 (AT-12, model swap) is not enforced here.** The bundle manifest"
            echo "  cannot be populated in CI — see the bundle-manifest row above for both reasons."
              echo "  The gate itself is proven able to fail by the negative test; it is the *subject*"
              echo "  that is missing, and that is a known gap, not a pass."
            echo "- **:app-android:test is not run by this workflow at all.** Its unit tests reference"
            echo "  \`:platform\`'s JVM classes, which the Android variant cannot see (they live in"
            echo "  \`app-android/src/test/java/dev/kasoti/android/ml/\`). The step"
            echo "  \`app-android/tools/verify-offline.sh\` covers the SDK-free subset of that module;"
            echo "  the rest is not covered by any step in this job."
            echo "- No device is attached, so \`:eval:run parity\` is never run and the eval harness"
            echo "  reports 4 = INCOMPLETE. INCOMPLETE is not a pass."
            echo "- ktlint and detekt are advisory and red. They are reported, not satisfied."
            echo
            echo "Each gate's own scope — what it proves and what it does not — is stated in that"
            echo "gate's step summary above, next to the measurement it actually made."
          } >> "$GITHUB_STEP_SUMMARY"

          # A run that silently failed to check something must not read like a clean run.
          # This is the same rule the PII step applies to "ran zero tests" and the
          # magic-threshold step applies to "exited 0 having scanned nothing", applied to
          # the report instead of to a single gate. A warning cannot fail the build, and
          # must not: an SDK-less runner is a fact about a machine, not a regression.
          if [ "$sdk_state" != "true" ]; then
            echo "::warning title=This push did not gate the shipping Android artefact::No usable Android SDK on this runner. :app-android:bundleRelease, :app-android:checkApkSize and the bundle-manifest gate were SKIPPED, not passed. See 'What this run did NOT establish' in the job summary."
          fi

  # ---------------------------------------------------------------------------
  # The offline proof (BUILD.md §1: "after that, airplane-build must succeed
  # (CI verifies with --offline weekly)").
  #
  # HONEST LIMITATION, restated in the job summary too: this is NOT a cold-cache proof.
  # The Gradle dependency cache on a fresh GitHub runner is empty, and an empty cache cannot
  # build --offline by construction. So the job runs TWO phases in one runner: (1) warm the
  # cache from the network, (2) build with --offline. Phase 2 is the real assertion — that a
  # warm cache is sufficient. It proves the build needs no network at BUILD time given a
  # populated cache, which is what an operator on a provisioned laptop has.
  # A genuine cold-start proof needs a self-hosted runner with a persistent Gradle home; that
  # is a documented follow-up, not something this job claims.
  # ---------------------------------------------------------------------------
  offline-proof:
    name: weekly offline (--offline) build proof
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.offline_proof == true)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle (cache must persist between the two phases)
        uses: gradle/actions/setup-gradle@v4

      - name: Phase 1 — warm the dependency cache (requires network)
        id: phase1
        run: ./gradlew --stacktrace :core:jvmTest :eval:test :ui:test

      - name: 'Phase 2 — build with --offline (the actual proof)'
        id: offline_build
        run: |
          set -euo pipefail
          ./gradlew --stop || true
          echo "### Offline proof: Gradle ran with --offline against a warmed cache." >> "$GITHUB_STEP_SUMMARY"
          echo "### This is NOT a cold-cache proof; see the job description." >> "$GITHUB_STEP_SUMMARY"
          ./gradlew --offline --stacktrace :core:jvmTest :core:allTests
          ./gradlew --offline --stacktrace :ui:test
          # EVAL.md §3: the harness's 4 = INCOMPLETE because the device gates are skipped
          # without a device, and that is the correct answer here. 2 and 3 still fail.
          # Same trap as the `verify` job: gradlew exits 1 for ANY non-zero harness code, so
          # the harness's own code is read out of Gradle's stderr, not from `$?`.
          log=$(mktemp)
          set +e
          ./gradlew --offline --stacktrace :eval:run --args="smoke" 2>&1 | tee "$log"
          gradle_code=${PIPESTATUS[0]}
          set -e
          if [ "$gradle_code" -eq 0 ]; then
            code=0
          else
            code=$(grep -o 'non-zero exit value [0-9]\+' "$log" | tail -n 1 | grep -o '[0-9]\+$' || true)
            code=${code:-none}
          fi
          rm -f "$log"
          echo "eval smoke offline: harness exit $code (gradlew exit $gradle_code)."
          # Surfaced so the job summary can report the harness's own verdict instead of
          # folding it into a single "Phase 2: success" cell. An INCOMPLETE (4) inside an
          # otherwise-successful step is exactly the kind of thing a single boolean hides.
          echo "eval_exit=$code" >> "$GITHUB_OUTPUT"
          case "$code" in
            0|4) echo "accepted (0 = pass, 4 = incomplete, no device attached)." ;;
            2|3) echo "::error::eval smoke offline: harness exit $code (EVAL.md §3: 2 = gate failed, 3 = INVALID)." ; exit 1 ;;
            *)   echo "::error::eval smoke offline: harness exit code '$code' not recognised (gradlew exit $gradle_code)." ; exit 1 ;;
          esac

      - name: 'Offline proof — :core has no network client (works offline)'
        id: offline_netban
        run: ./scripts/check_no_network_in_core.sh

      - name: Offline proof — the Android SDK-free layer still compiles offline
        id: offline_android
        run: |
          set -uo pipefail
          set +e
          ./app-android/tools/verify-offline.sh
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::verify-offline.sh failed offline with exit $code."
            exit 1
          fi
          echo "::notice::SDK-free layer only: no aapt2/R8/resources/manifest, and no device."

      # NOT a gate today, and it must not read like one. `bundleOffline` is not a Gradle
      # task in this tree (AGENTS.md §1: "never an AGP task in this tree; there is no
      # bundle"), so this step has nothing to verify. It used to carry
      # `continue-on-error: true` over a branch that printed a notice and exited 0 — a
      # step that verified nothing and reported `success`, which is the defect class this
      # job exists to remove. `continue-on-error` is gone; the not-implemented branch is
      # unchanged in what it DOES (it still declines to run a task that does not exist)
      # and differs only in how loudly it says so: a warning annotation, and a row in the
      # offline summary that reads NOT IMPLEMENTED rather than blank.
      #
      # Not made blocking: the task is declared in BUILD.md §3 / AGENTS.md §1 and simply
      # does not exist, so a hard failure here would be a permanently red weekly job for a
      # missing feature rather than a regression — the same always-red reasoning the
      # eval-smoke step applies to exit 4. Closing it means implementing the task.
      - name: 'Offline proof — bundling with --offline'
        id: offline_bundle
        run: |
          set -euo pipefail
          if ./gradlew -q help --task bundleOffline >/dev/null 2>&1; then
            ./gradlew --offline --stacktrace bundleOffline
            echo "bundle_offline_state=RAN" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Offline bundling NOT IMPLEMENTED::\`bundleOffline\` is not a Gradle task in this tree, so this step verified nothing. Declared in BUILD.md §3 / AGENTS.md §1; there is no bundle and no offline bundling. This row is NOT IMPLEMENTED, not passed."
            echo "::notice::Run \`gh run list\` and read this row as NOT IMPLEMENTED. A green step here means the guard worked, not that a bundle was built."
            echo "bundle_offline_state=NOT_IMPLEMENTED" >> "$GITHUB_OUTPUT"
          fi

      - name: Offline proof — result
        id: offline_result
        if: always()
        run: |
          {
            echo "## Offline (--offline) proof — ${{ job.status }}"
            echo
            echo "| Step | Result |"
            echo "|---|---|"
            echo "| Phase 1 — warm the dependency cache (needs network) | ${{ steps.phase1.outcome || 'not run' }} |"
            echo "| Phase 2 — build with --offline (the actual proof) | ${{ steps.offline_build.outcome || 'not run' }} |"
            echo "| eval smoke --offline (inside Phase 2) | harness exit ${{ steps.offline_build.outputs.eval_exit || 'n/a' }} — 0 pass / 4 INCOMPLETE (no device) are both accepted; 2 and 3 fail the job |"
            echo "| :core has no network client | ${{ steps.offline_netban.outcome || 'not run' }} |"
            echo "| Android SDK-free layer compiles offline | ${{ steps.offline_android.outcome || 'not run' }} — SDK-free layer only: no aapt2/R8/resources/manifest, and no device |"
            echo "| offline bundling | ${{ steps.offline_bundle.outputs.bundle_offline_state || 'not run' }} |"
            echo
            echo "**What this proves:** a build that has already resolved its dependencies"
            echo "needs no network to compile, test and run the eval harness. That is the"
            echo "state a provisioned field laptop is in."
            echo
            echo "**What this does NOT prove:** that a cold machine with an empty Gradle"
            echo "cache can build. It cannot, by construction — an empty cache has nothing"
            echo "to resolve from with --offline. A real cold-start proof needs a"
            echo "self-hosted runner with a persistent Gradle home (docs/STATUS.md)."
            echo
            echo "**And:** \`offline bundling\` is **${{ steps.offline_bundle.outputs.bundle_offline_state || 'not run' }}** —"
            echo "\`bundleOffline\` is not a Gradle task in this tree. That row is a declared gap,"
            echo "not a pass."
            echo
            echo "This job runs on a schedule or on manual dispatch, so it is reported"
            echo "\`skipped\` on an ordinary push. That is the event filter, not a gate result."
          } >> "$GITHUB_STEP_SUMMARY"
